seed: 42

model:
  base_model: "runwayml/stable-diffusion-v1-5"
  torch_dtype: "float16"
  identity_encoder: "ip_adapter_clip"   # ip_adapter_clip | dinov2 | insightface
  identity_dim: 1024                    # CLIP ViT-H/14 output dim; 1024 for DINOv2 ViT-L
  num_identity_tokens: 4                # IP-Adapter projects image feat to N tokens
  identity_scale: 0.5

storydiffusion:
  use_consistent_self_attn: true
  min_frames_per_story: 3
  frames_per_story: 3

lora:
  enabled: true
  rank: 8
  alpha: 32
  dropout: 0.05
  target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
  # Do NOT include self-attention when consistent_self_attn is on.

training:
  precision: "fp16"
  gradient_checkpointing: true
  batch_size: 1
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_train_steps: 30000
  warmup_steps: 500
  lr_scheduler: "cosine"
  save_every: 2000
  log_every: 50
  identity_consistency_loss_weight: 0.1
  max_grad_norm: 1.0

data:
  dataset: "pororo"
  pororo_png_dir: "/home/batman/scratch.msml612pcs3/data/pororo/raw/pororo_png"
  flintstones_png_dir: "/home/batman/scratch.msml612pcs3/data/flintstones/raw"
  image_resolution: 512
  num_workers: 4

paths:
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "logs"
